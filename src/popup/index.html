<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prompt Queue for ChatGPT</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #111418;
        --muted: #5b6470;
        --border: #e5e7eb;
        --accent: #10a37f;
        --accent-hover: #0e8f6e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1f2023;
          --fg: #ececf1;
          --muted: #a0a6b0;
          --border: #34363b;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        width: 300px;
        padding: 16px;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      .head { display: flex; align-items: center; gap: 10px; }
      .logo { width: 36px; height: 36px; border-radius: 9px; flex: none; }
      h1 { margin: 0; font-size: 15px; font-weight: 600; }
      p { margin: 12px 0 0; color: var(--muted); }
      .cta {
        display: block;
        margin-top: 16px;
        padding: 10px 12px;
        text-align: center;
        text-decoration: none;
        font-weight: 600;
        color: #ffffff;
        background: var(--accent);
        border-radius: 8px;
      }
      .cta:hover { background: var(--accent-hover); }
      ol { margin: 12px 0 0; padding-left: 18px; color: var(--muted); }
      ol li { margin: 2px 0; }
      .foot {
        margin-top: 16px;
        padding-top: 12px;
        border-top: 1px solid var(--border);
        font-size: 11px;
        color: var(--muted);
      }
      .foot a { color: var(--muted); }
    </style>
  </head>
  <body>
    <div class="head">
      <svg class="logo" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#12b48c" />
            <stop offset="100%" stop-color="#0c8a68" />
          </linearGradient>
        </defs>
        <rect width="128" height="128" rx="26" fill="url(#bg)" />
        <rect x="22" y="34" width="64" height="12" rx="6" fill="#ffffff" opacity="0.95" />
        <rect x="22" y="56" width="74" height="12" rx="6" fill="#ffffff" opacity="0.8" />
        <rect x="22" y="78" width="50" height="12" rx="6" fill="#ffffff" opacity="0.65" />
        <polygon points="84,82 110,98 84,114" fill="#ffffff" />
      </svg>
      <h1>Prompt Queue for ChatGPT</h1>
    </div>

    <p>The queue panel lives on the ChatGPT page itself, not here.</p>

    <ol>
      <li>Open ChatGPT.</li>
      <li>Click the green pill at the bottom-right.</li>
      <li>Add prompts and press Start.</li>
    </ol>

    <a class="cta" href="https://chatgpt.com" target="_blank" rel="noopener noreferrer">Open ChatGPT</a>

    <div class="foot">
      Runs only on chatgpt.com. No data leaves your browser.
      Not affiliated with OpenAI.
    </div>
  </body>
</html>
